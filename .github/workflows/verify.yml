name: Verify application
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock.txt
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_LOCAL_DEVELOPMENT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      MASTRR_API_ORIGIN: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          MASTRR_PYTHON: python
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mastrr
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: mastrr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mastrr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mastrr:ci-test-only@localhost:5432/mastrr
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock.txt
      - run: python -m alembic upgrade head
      - run: python -m backend.seed
      - run: python -m scripts.operations doctor
      - run: python -m tests.postgres_verify
        env:
          MASTRR_POSTGRES_TEST: "1"
