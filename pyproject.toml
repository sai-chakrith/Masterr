[project]
name = "mastrr"
version = "0.1.0"
description = "Evidence-based aptitude learning"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.161.1",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "uvicorn==0.54.0",
    "PyJWT[crypto]==2.15.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
